<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f4d36">
<title>Baumkataster (Test)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f2f5f2;--card:#fff;--ink:#17211b;--mute:#5c685f;--line:#dce3de;
  --brand:#1f4d36;--focus:#e8a317;
  --red:#a8231b;--red-bg:#fde8e5;--red-m:#d1342b;
  --blu:#0b5cad;--blu-bg:#dcebfb;--org:#8a4300;--org-bg:#ffe5cc;--org-m:#ef7d00;
  --yel:#6b5400;--yel-bg:#fff5bf;--yel-m:#f2c200;
  --grn:#1b6a3d;--grn-bg:#dff1e5;--grn-m:#2e9958;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
small,.mute{color:var(--mute)}

/* Buttons */
.btn{border:1px solid transparent;border-radius:8px;padding:0 14px;min-height:42px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.pri{background:#2e9958}
.btn.big{min-height:50px;font-size:16px;padding:0 20px}
.btn.sec{background:#fff;color:var(--ink);border-color:#b8c3bb}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.btn.dan{background:#fff;color:var(--red);border-color:#e3a8a3}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}

/* Chips */
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.red{background:var(--red-bg);color:var(--red)}
.chip.blu{background:var(--blu-bg);color:var(--blu)}
.chip.org{background:var(--org-bg);color:var(--org)}
.chip.yel{background:var(--yel-bg);color:var(--yel)}
.chip.grn{background:var(--grn-bg);color:var(--grn)}
.chip.neu{background:#e8ece9;color:var(--mute);font-weight:600}
.idchip{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;letter-spacing:.3px;margin-right:6px}

/* Login */
#login{margin:auto;width:min(360px,92vw);display:flex;flex-direction:column;gap:12px;background:var(--card);padding:26px;border-radius:14px;border:1px solid var(--line)}
#login h1{margin:0;color:var(--brand);font-size:24px}
#err{color:var(--red);min-height:1.2em}
label{display:block;font-size:13px;font-weight:600;color:var(--mute)}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],input[type=number],textarea,select{display:block;width:100%;margin-top:3px;padding:9px 10px;min-height:42px;border:1px solid #b8c3bb;border-radius:8px;background:#fff;color:var(--ink);font-weight:400}
input[readonly]{background:#eef2ef;color:var(--mute)}
textarea{min-height:70px;resize:vertical}
.hint{display:block;font-weight:400;font-size:12.5px;color:var(--mute);margin-top:3px}

/* Header */
header{background:var(--brand);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 14px;flex-wrap:wrap}
header h1{margin:0 auto 0 0;font-size:18px;letter-spacing:.2px}
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer;min-height:42px;min-width:42px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,.16);font-size:20px}
.menu>summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:48px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;min-width:210px;z-index:2000}
.menu .pop button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer;min-height:42px}
.menu .pop button:hover{background:#eef3ef}

/* Layout: Karte | Trenner | Panel */
#app{flex:1;min-height:0;display:grid;grid-template-columns:min(var(--mapw,55%),calc(100% - 430px)) 8px minmax(0,1fr)}
body.nomap #app{grid-template-columns:minmax(0,1fr)}
body.nomap #mapwrap,body.nomap #split{display:none}
#mapwrap{position:relative;min-height:0;min-width:0}
#map{position:absolute;inset:0}
#split{background:var(--line);cursor:col-resize;touch-action:none;position:relative}
#split::after{content:"";position:absolute;left:2px;right:2px;top:50%;height:44px;margin-top:-22px;border-radius:3px;background:#9aa8a0}
#split:hover,#split:focus-visible,#split.drag{background:#c3d0c8}
#panel{overflow:auto;background:var(--bg);padding:14px;min-height:0}

/* Map overlays */
.ov{position:absolute;z-index:1000}
#tools{left:10px;top:10px;width:min(330px,calc(100% - 70px));display:flex;flex-direction:column;gap:6px}
#tools form{display:flex;gap:6px}
#tools input{margin:0;box-shadow:0 1px 6px rgba(0,0,0,.2)}
#tools .row{display:flex;gap:6px;flex-wrap:wrap}
.seg-m{display:inline-flex;background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.2);overflow:hidden}
.seg-m button{border:0;background:#fff;padding:0 10px;min-height:34px;font-size:13px;cursor:pointer;font-weight:600;color:var(--mute)}
.seg-m button.on{background:var(--brand);color:#fff}
#legend{left:10px;bottom:10px;background:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;box-shadow:0 1px 6px rgba(0,0,0,.2);display:flex;gap:12px;flex-wrap:wrap}
#legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#pick{left:50%;transform:translateX(-50%);bottom:56px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 20px);box-shadow:0 4px 18px rgba(0,0,0,.35)}
#pick .btn{min-height:36px}

/* Dashboard */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:12px}
.sum button{border:2px solid transparent;border-radius:var(--r);padding:9px 10px;text-align:left;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:2px}
.sum button b{font-size:24px;line-height:1.1}
.sum button span{font-size:12.5px;font-weight:600;color:var(--mute)}
.sum button.red{background:var(--red-bg)}.sum button.red b{color:var(--red)}
.sum button.rdk{background:var(--red);}.sum button.rdk b,.sum button.rdk span{color:#fff}
.sum button.blu{background:var(--blu-bg)}.sum button.blu b{color:var(--blu)}
.sum button.org{background:var(--org-bg)}.sum button.org b{color:var(--org)}
.sum button.yel{background:var(--yel-bg)}.sum button.yel b{color:var(--yel)}
.sum button.on{border-color:var(--ink)}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar input,.bar select{margin:0}
.bar select{width:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.tbl{padding:0;overflow:hidden}
.tbl .sc{overflow:auto;max-height:calc(100dvh - 290px)}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:#eef2ef;text-align:left;font-size:12.5px;color:var(--mute);padding:0;border-bottom:1px solid var(--line);z-index:1}
th button{all:unset;display:block;width:100%;box-sizing:border-box;padding:9px 10px;cursor:pointer;font-weight:700}
th button:hover{color:var(--ink)}
td{padding:8px 10px;border-bottom:1px solid #eef1ee;vertical-align:middle}
tr.r{cursor:pointer}
tr.r:hover td{background:#f4f8f5}
td small{display:block;line-height:1.25}
td.idc{white-space:nowrap;font-weight:700}
.badge{font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.badge.blu{background:var(--blu-bg);color:var(--blu)}.badge.red{background:var(--red);color:#fff}.badge.org{background:var(--org-bg);color:var(--org)}
.empty{padding:26px 16px;text-align:center;color:var(--mute)}

/* Detail */
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dhead h2{margin:0;font-size:21px;line-height:1.2}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .lb{font-size:12px;font-weight:700;color:var(--mute)}
.tile .big{font-size:24px;line-height:1.2}
.tile small{font-size:12.5px;font-weight:600}
.tile.red{background:var(--red-bg);border-color:#efb7b2}.tile.red .big,.tile.red small{color:var(--red)}
.tile.org{background:var(--org-bg);border-color:#f2c394}.tile.org .big,.tile.org small{color:var(--org)}
.tile.yel{background:var(--yel-bg);border-color:#ecd987}.tile.yel .big,.tile.yel small{color:var(--yel)}
.tile.grn{background:var(--grn-bg);border-color:#aed6bb}.tile.grn .big,.tile.grn small{color:var(--grn)}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
h3{margin:0 0 8px;font-size:16px}
h4{margin:14px 0 6px;font-size:13px;color:var(--mute)}
#hist{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.hrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:92px 1fr 70px 80px;gap:8px;align-items:center;width:100%;padding:9px 10px;border-bottom:1px solid #eef1ee;cursor:pointer;font-size:14px}
.hrow:last-child{border-bottom:0}
.hrow:hover{background:#f4f8f5}
.hrow.on{background:#e6f1ea;font-weight:700}
.hrow:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.num{position:relative;margin-top:3px}
.num input{margin:0;padding-right:44px;-moz-appearance:textfield}
.num input::-webkit-inner-spin-button,.num input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ar{position:absolute;right:3px;top:3px;bottom:3px;width:34px;display:flex;flex-direction:column;gap:2px}
.ar button{flex:1;border:0;border-radius:5px;background:#e4ebe6;color:var(--brand);cursor:pointer;font-size:11px;line-height:1;padding:0}
.ar button:hover{background:#cfdcd3}
.ar button:active{background:var(--brand);color:#fff}
.unit{font-weight:400;color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.seg label{margin:0;position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%;margin:0}
.seg span{display:flex;align-items:center;min-height:42px;padding:0 14px;border:2px solid #c3cdc6;border-radius:8px;background:#fff;color:var(--ink);font-weight:600;font-size:14px}
.seg input:focus-visible+span{outline:3px solid var(--focus)}
.seg input:checked+span{color:#fff;border-color:var(--brand);background:var(--brand)}
.seg.rk .gering input:checked+span{background:var(--grn-m);border-color:var(--grn-m)}
.seg.rk .mittel input:checked+span{background:var(--yel-m);border-color:var(--yel-m);color:#2b2200}
.seg.rk .hoch input:checked+span{background:var(--red-m);border-color:var(--red-m)}
.ck{display:flex;align-items:center;gap:9px;margin:0;padding:7px 0;font-size:14.5px;font-weight:500;color:var(--ink);cursor:pointer}
.ck input{width:22px;height:22px;flex:none;accent-color:var(--brand);margin:0}
.ck.prio{color:var(--blu);font-weight:700}
.ck.warn{color:var(--red);font-weight:700}
.chk{border:1px solid var(--line);border-radius:8px;margin-top:8px}
.chk summary{cursor:pointer;padding:10px 12px;font-weight:700;list-style:none;display:flex;justify-content:space-between;min-height:42px;align-items:center}
.chk summary::-webkit-details-marker{display:none}
.chk summary::after{content:"▾";color:var(--mute)}
.chk[open] summary::after{content:"▴"}
.chk .cnt{margin-left:8px;background:var(--yel-bg);color:var(--yel);border-radius:999px;padding:0 8px;font-size:12.5px}
.chk .cnt.z{background:#e8ece9;color:var(--mute)}
.chk .cg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;padding:0 12px 8px}
details.card>summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;min-height:30px}
details.card>summary::-webkit-details-marker{display:none}
details.card[open]>summary{margin-bottom:10px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* Toast / Dialog */
#st{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:#17211b;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5000;max-width:92vw}
#st.show{opacity:1}#st.err{background:var(--red)}
dialog{border:0;border-radius:14px;padding:18px;width:min(440px,94vw);max-height:94dvh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{font-size:18px}
dialog .g2{margin:8px 0}

@media(max-width:900px){
  body{height:auto;min-height:100dvh}
  html{height:auto}
  #app{display:flex;flex-direction:column}
  #split{display:none}
  #mapwrap{height:42dvh;flex:none}
  #panel{overflow:visible}
  .tbl .sc{max-height:none}
}
@media(max-width:700px){
  th.hide-s,td.hide-s{display:none}
  .chk .cg{grid-template-columns:1fr}
  .hrow{grid-template-columns:84px 1fr 60px 74px}
  .tile .big{font-size:20px}
  header h1 .t{display:none}
  #panel{padding:10px}
}
</style>
</head>
<body>

<div id="login" hidden>
  <h1>Baumkataster <span class="chip yel">Test</span></h1>
  <p class="mute" style="margin:0"><small>Testversion ohne Datenbank: Alle Daten bleiben nur in diesem Browser.<br>Anmeldung mit <b>admin</b> / <b>admin</b></small></p>
  <label>E-Mail / Benutzer<input id="em" type="email" autocomplete="username"></label>
  <label>Passwort<input id="pw" type="password" autocomplete="current-password"></label>
  <button class="btn" id="bLogin">Anmelden</button>
  <div id="err" role="alert"></div>
</div>

<header id="hd" hidden>
  <h1>🌳<span class="t"> Baumkataster</span> <span class="chip yel">Test</span></h1>
  <button class="btn pri big" id="bAdd">+ Neuer Baum</button>
  <button class="btn ghost" id="bMap" type="button">🗺 Karte ausblenden</button>
  <details class="menu" id="menu">
    <summary aria-label="Menü">⋮</summary>
    <div class="pop">
      <button id="bBlank">PDF: leeres Protokoll</button>
      <button id="bCsv">Export: Liste (CSV)</button>
      <button id="bReset">Testdaten zurücksetzen</button>
      <button id="bOut">Abmelden</button>
    </div>
  </details>
</header>

<div id="app" hidden>
  <div id="mapwrap">
    <div id="map"></div>
    <div class="ov" id="tools">
      <form id="geoForm"><input id="geoQ" type="search" placeholder="Adresse auf der Karte suchen" aria-label="Adresse suchen"><button class="btn" type="submit">Suchen</button></form>
      <div class="row">
        <button class="btn sec sm" id="bHome" type="button">Startpunkt</button>
        <button class="btn sec sm" id="bAll" type="button">Alle anzeigen</button>
        <span class="seg-m" role="group" aria-label="Karte einfärben nach"><button id="mP" type="button" class="on">Prüfung</button><button id="mR" type="button">Risiko</button></span>
      </div>
    </div>
    <div class="ov" id="legend"></div>
    <div class="ov" id="pick" hidden><span id="pickTxt"></span><button class="btn sec" id="pickX" type="button">Abbrechen</button></div>
  </div>
  <div id="split" role="separator" aria-orientation="vertical" aria-label="Breite der Karte ändern (Pfeiltasten oder ziehen)" tabindex="0"></div>
  <main id="panel">
    <section id="dash"></section>
    <section id="detail" hidden></section>
  </main>
</div>

<dialog id="dlg">
  <h3 id="dTitleNew">Neuer Baum</h3>
  <label>Name / Bezeichnung (optional)<input id="n_name" type="text" placeholder="z. B. Eiche an der Einfahrt">
    <span class="hint">Leer lassen: Der Baum erhält automatisch eine ID (z. B. B-113) und wird so benannt.</span></label>
  <div class="g2">
    <label id="n_artl">Baumart<input id="n_art" type="text" list="baumarten" autocomplete="off" placeholder="Tippen, z. B. Esch …"></label>
    <label id="n_hw">Baumhöhe (m)
      <div class="num"><input id="n_h" type="number" step="0.1" min="0" inputmode="decimal"><span class="ar"><button type="button" data-nstep="0.1" aria-label="10 cm höher">▲</button><button type="button" data-nstep="-0.1" aria-label="10 cm niedriger">▼</button></span></div>
    </label>
    <label>Straße<input id="n_str" type="text"></label>
    <label>Hausnr.<input id="n_nr" type="text"></label>
    <label>PLZ<input id="n_plz" type="text"></label>
    <label>Stadt<input id="n_ort" type="text"></label>
  </div>
  <h4 style="margin-top:6px">Position bestimmen</h4>
  <div class="seg" role="radiogroup">
    <label><input type="radio" name="npos" value="adresse" checked><span>Aus Adresse</span></label>
    <label><input type="radio" name="npos" value="karte"><span>Auf Karte setzen</span></label>
    <label><input type="radio" name="npos" value="gps"><span>Mein Standort</span></label>
  </div>
  <span class="hint">Die genaue Position lässt sich später jederzeit auf der Karte neu setzen.</span>
  <label class="ck" style="margin-top:6px"><input id="n_first" type="checkbox" checked>Erste Prüfung gleich anlegen</label>
  <div class="acts" style="margin-bottom:0"><button class="btn pri" id="nSave">Weiter</button><button class="btn sec" id="nCancel">Abbrechen</button></div>
</dialog>
<div id="st" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ===== Konfiguration: Werte aus Supabase (Project Settings > API) =====
const SUPABASE_URL = 'https://zjfdtuzadhfjahzzvsta.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EnJZSLzF4gphSFuiCtPQVg_QdMOXEmZ';
const HOME_QUERY = 'Eisenwerkstraße, Schwelm';
const HOME_FALLBACK = [51.2866, 7.3011];   // Schwelm, falls die Adresssuche nicht erreichbar ist
const WARN_DAYS = 90, URGENT_DAYS = 30;    // gelb: ≤ 3 Monate vor Fristende, orange: ≤ 1 Monat, rot: überfällig

// ===== Helfer =====
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtD = s => s ? parseD(s).toLocaleDateString('de-DE') : '–';
const fmtN = (n, d = 1) => n == null ? '–' : Number(n).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const num0 = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; };
const addr = t => [[t.strasse, t.hausnummer].filter(Boolean).join(' '), [t.plz, t.stadt].filter(Boolean).join(' ')].filter(Boolean).join(', ');
const mobile = () => window.matchMedia('(max-width:900px)').matches;
function toast(m, err) { const s = $('st'); s.textContent = m; s.className = err ? 'show err' : 'show'; clearTimeout(toast.t); toast.t = setTimeout(() => s.className = '', err ? 5000 : 2000); }

const RISK = { gering: { c: 'grn', col: '#2e9958', rank: 0 }, mittel: { c: 'yel', col: '#f2c200', rank: 1 }, hoch: { c: 'red', col: '#d1342b', rank: 2 } };
const ST = { red: { col: '#d1342b' }, org: { col: '#ef7d00' }, yel: { col: '#f2c200' }, grn: { col: '#2e9958' } };
const PHASE = ['Jugendphase', 'Reifephase', 'Alterungsphase'];
const ZUST = ['Gesund', 'Leicht geschädigt', 'Stark geschädigt'];
const ZUST_ALT = { 'gesund/leicht geschädigt': 'Gesund', 'stärker geschädigt': 'Stark geschädigt' };

const T = o => TYPES[o.typ] || TYPES.baum;

// Prüfstatus: rot = überfällig oder nie geprüft; orange = ≤ 1 Monat; gelb = ≤ 3 Monate; sonst grün.
// Frist: Intervall der letzten Prüfung (Jahre), sonst Standardintervall des Typs (Baum: 12 Monate).
function monthsOf(t) { const y = num0(t.aktuell?.intervall); return y && y > 0 && y <= 10 ? Math.round(y * 12) : T(t).months; }
function status(t) {
  if (!t.letzte_pruefung) return { k: 'red', days: -1e6, label: 'Noch nie geprüft', due: null };
  const l = parseD(t.letzte_pruefung), due = new Date(l.getFullYear(), l.getMonth() + monthsOf(t), l.getDate());
  const days = Math.round((due - today()) / 864e5);
  if (days < 0) return { k: 'red', days, due, label: `${-days} ${-days === 1 ? 'Tag' : 'Tage'} überfällig` };
  if (days === 0) return { k: 'org', days, due, label: 'heute fällig' };
  const txt = `fällig in ${days} ${days === 1 ? 'Tag' : 'Tagen'}`;
  if (days <= URGENT_DAYS) return { k: 'org', days, due, label: txt };
  if (days <= WARN_DAYS) return { k: 'yel', days, due, label: txt };
  return { k: 'grn', days, due, label: 'fällig am ' + due.toLocaleDateString('de-DE') };
}

  const prDef = p => ({ id: uid(), objekt_id: null, datum: ld(0), pruefer: null, sicherheit: 'gering', handlungsbedarf: 'nein', massnahmen: null, anmerkungen: null, erledigung_sofort: false, erledigung_wochen: null, daten: {}, created_at: stamp(), ...p });

  // entspricht dem Datenbank-Trigger objekt_kennung(): ID vergeben, leere Bezeichnung mit ID füllen
  function kennung(o) {

  // entspricht dem Datenbank-Trigger sync_objekt(): neueste Prüfung bestimmt die aktuellen Werte
  function sync(bid) {
    const t = db.objekte.find(x => x.id === bid); if (!t) return;
    const n = db.pruefungen.filter(k => k.objekt_id === bid).sort((a, b) => b.datum.localeCompare(a.datum) || b.created_at.localeCompare(a.created_at))[0];
    if (n) Object.assign(t, { aktuell: clone(n.daten), sicherheit: n.sicherheit, handlungsbedarf: n.handlungsbedarf, pruefer: n.pruefer, letzte_pruefung: n.datum });

  function seed(c) {
    const d = { objekttypen: [{ code: 'baum', bezeichnung: 'Baum', praefix: 'B', intervall_monate: 12, zaehler: 0 }], objekte: [], pruefungen: [] }; db = d;
    const G = 'gesund/leicht geschädigt', B = 'stärker geschädigt', P = ['M. Becker', 'S. Yilmaz'];

      [null, 'Spitzahorn (Acer platanoides)', 'Eisenwerkstraße', '7', 0, 15, 12.8, 9.0, 190, 'Reifephase', G, 'gering', 'nein', false, 60, [], '', 1],

      ['Buche Hauptstraße', 'Rotbuche (Fagus sylvatica)', 'Hauptstraße', '25', -120, 5, 19.7, 15.2, 335, 'Reifephase', B, 'mittel', 'ja', false, 150, ['K5', 'K11', 'W3'], 'Pilzbefall beobachten', 1],

      [null, 'Eberesche (Sorbus aucuparia)', 'Am Park', '4', 55, -55, 6.2, 4.1, 75, 'Jugendphase', G, 'gering', 'nein', false, 345, [], '', 0],
      [null, 'Sandbirke (Betula pendula)', 'Am Park', '6', 95, -30, 11.3, 7.2, 140, 'Alterungsphase', B, 'hoch', 'ja', false, 300, ['K13', 'K15', 'S7'], 'Totholz beseitigen, Wipfeldürre prüfen', 1],
      ['Esche Brunnen', 'Esche (Fraxinus excelsior)', 'Brunnenstraße', '8', -45, -80, 17.6, 12.8, 260, 'Alterungsphase', B, 'hoch', 'ja', true, 380, ['K15', 'K2', 'K13', 'S11'], 'Eschentriebsterben, Fällung erforderlich', 2],
      [null, 'Feldahorn (Acer campestre)', 'Brunnenstraße', '10', -10, -110, 8.4, 6.8, 98, 'Jugendphase', G, 'gering', 'nein', false, 100, [], '', 0],

    ];
    spec.forEach(([name, art, str, nr, dx, dy, h, br, um, ph, zu, ri, ha, fa, ago, bef, mass, prev], idx) => {
      const t = objDef({ typ: 'baum', name, art, strasse: str, hausnummer: nr, plz: '58332', stadt: 'Schwelm', lat: c[0] + dy / 111000, lng: c[1] + dx / (111000 * Math.cos(c[0] * Math.PI / 180)), pos_quelle: idx === 14 ? 'adresse' : 'karte', stamm: { alter_standort: idx % 3 ? '' : '~60 Jahre' } });

          massnahmen: i ? null : (mass || null), anmerkungen: i ? null : (bef.length ? 'Siehe Regelkontrolle' : null),

            phase: ph, zustand: i ? G : zu, intervall: '1', abstimmung_fachabt: false, eingehende_untersuchung: false, faellung: i ? false : fa,
            befunde: i ? bef.slice(0, Math.max(0, bef.length - 2 * i)) : bef.slice()

  }

  const save = () => localStorage.setItem(KEY, JSON.stringify(db));
  const ready = (async () => {
    try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) { db = null; }
    if (!db || !db.objekte) { seed(await center()); save(); }
  })();

  const cmp = (a, b) => a == null ? (b == null ? 0 : -1) : b == null ? 1 : typeof a === 'string' ? a.localeCompare(b, 'de', { numeric: true }) : a - b;
  class Q {
    constructor(t) { this.t = t; this.op = 'select'; this.f = []; this.o = []; this.ret = true; }
    select() { this.ret = true; return this; }
    insert(r) { this.op = 'insert'; this.p = r; this.ret = false; return this; }
    update(p) { this.op = 'update'; this.p = p; this.ret = false; return this; }
    delete() { this.op = 'delete'; this.ret = false; return this; }
    eq(c, v) { this.f.push([c, v]); return this; }
    order(c, opt) { this.o.push([c, !(opt && opt.ascending === false)]); return this; }
    range(a, b) { this.r = [a, b]; return this; }
    single() { this.one = true; return this; }
    then(res, rej) { return this.run().then(res, rej); }
    async run() {

        let data;
        if (this.op === 'select') {
          data = rows.filter(m).map(clone);
          this.o.slice().reverse().forEach(([c, asc]) => data.sort((a, b) => (asc ? 1 : -1) * cmp(a[c], b[c])));
          if (this.r) data = data.slice(this.r[0], this.r[1] + 1);
        } else if (this.op === 'insert') {
          if (!isO && !isP) throw new Error('Schreibzugriff nicht erlaubt');

            if (typeof r.lat !== 'number' || typeof r.lng !== 'number') throw new Error('Position fehlt');

            if (db.objekte.some(o => o.kennung === r.kennung)) throw new Error('ID existiert bereits');
          }
          if (isP) {
            if (!db.objekte.some(t => t.id === r.objekt_id)) throw new Error('Objekt existiert nicht (Fremdschlüssel)');
            if (!r.datum) throw new Error('Datum darf nicht leer sein');
          }
          if (r.sicherheit && !RISK[r.sicherheit]) throw new Error('Ungültiges Sicherheitsrisiko');
          rows.push(r); data = [clone(r)]; if (isP) sync(r.objekt_id);
        } else if (this.op === 'update') {
          const tg = rows.filter(m);
          if (this.p.sicherheit && !RISK[this.p.sicherheit]) throw new Error('Ungültiges Sicherheitsrisiko');
          tg.forEach(r => { Object.assign(r, clone(this.p)); if (isP) sync(r.objekt_id); }); data = tg.map(clone);
        } else {
          const tg = rows.filter(m); db[this.t] = rows.filter(r => !tg.includes(r)); data = tg.map(clone);
          if (isO) db.pruefungen = db.pruefungen.filter(k => !tg.some(t => t.id === k.objekt_id)); else if (isP) tg.forEach(k => sync(k.objekt_id));
        }

async function patch(tbl, obj, p) {

  const { error } = await sb.from(tbl).update(p).eq('id', obj.id);
  if (error) { Object.assign(obj, old); toast('Speichern fehlgeschlagen: ' + error.message, true); return false; }
  toast('Gespeichert'); return true;
}
function readVal(el) {
  if (el.type === 'checkbox') return el.checked;
  if (el.type === 'number') { if (el.value === '') return null; const n = Math.round(parseFloat(el.value) * 100) / 100; return isNaN(n) || n < 0 ? undefined : n; }
  if (el.type === 'radio') return el.value;
  const v = el.value.trim();
  return el.type === 'date' ? (v || undefined) : (v || null);
}

    const c = el.closest('details').querySelector('.cnt'), n = el.closest('.cg').querySelectorAll('input:checked').length;
    c.textContent = n; c.classList.toggle('z', !n);
    return void await patch('pruefungen', k, { daten: { ...k.daten, befunde: [...bf] } });
  }
  let v = readVal(el);
  if (ds.t || ds.s) {
    const f = ds.t || ds.s;
    if (ds.t === 'name' && !v) v = t.kennung;            // leere Bezeichnung: ID als Name
    if (v === undefined) { toast('Ungültiger Wert', true); renderDetail(); return; }

async function newPruefung() {

$('pickX').onclick = () => { const was = S.tool; setTool(null); if (was === 'add' && S.draft) { S.draft = null; $('dlg').showModal(); } };
async function mapClick(ll) {

  else if (S.tool === 'move' && S.sel) {

async function posFromAddress() {

// ===== Neues Objekt =====
function openNew() {

const readDlg = () => { const v = i => $(i).value.trim() || null, h = parseFloat($('n_h').value); return { name: v('n_name'), art: v('n_art'), strasse: v('n_str'), hausnummer: v('n_nr'), plz: v('n_plz'), stadt: v('n_ort'), hoehe: isNaN(h) ? null : h, first: $('n_first').checked }; };

$('nSave').onclick = async () => {

async function insertObject(f, ll, src) {

function makePdf(o, ks, blank, suffix) {

        let x = X + LW + 3; v.o.forEach(([txt, on]) => { box(x, y + 2.1, on); doc.text(txt, x + 4.8, y + 4.9); x += 4.8 + doc.getTextWidth(txt) + 6; }); y += 7.5; return;
      }

        for (let i = 0; i < l.length; i += 2) { need(5.5); [0, 1].forEach(j => { const x = l[i + j]; if (x) { box(X + j * 90, y + .6, bef.includes(x.split(' ')[0])); doc.text(x, X + j * 90 + 5, y + 3.2); } }); y += 5; }

  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
  doc.text(blank ? 'Datum: ____________________' : `${addr(o) || 'ohne Adresse'}   |   erstellt am ${new Date().toLocaleDateString('de-DE')}`, X, y + 2); doc.setTextColor(0); y += 8;
